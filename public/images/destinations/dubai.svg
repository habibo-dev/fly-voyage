<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Skyline de Dubaï à l'heure bleue">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1730"/>
      <stop offset="0.45" stop-color="#22406c"/>
      <stop offset="0.75" stop-color="#8a5a3a"/>
      <stop offset="1" stop-color="#d0925a"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2c4a"/>
      <stop offset="1" stop-color="#0a1424"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f4e9d2" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#f4e9d2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="780" fill="url(#sky)"/>
  <rect y="780" width="1600" height="220" fill="url(#sea)"/>

  <!-- stars -->
  <g fill="#e9e2d0" opacity="0.7">
    <circle cx="140" cy="120" r="2"/>
    <circle cx="320" cy="70" r="1.6"/>
    <circle cx="520" cy="150" r="1.8"/>
    <circle cx="760" cy="90" r="1.5"/>
    <circle cx="930" cy="140" r="2"/>
    <circle cx="1450" cy="90" r="1.8"/>
    <circle cx="1520" cy="220" r="1.5"/>
    <circle cx="80" cy="260" r="1.5"/>
    <circle cx="640" cy="60" r="1.4"/>
    <circle cx="1180" cy="70" r="1.6"/>
  </g>

  <!-- moon -->
  <circle cx="1290" cy="180" r="120" fill="url(#moonGlow)"/>
  <circle cx="1290" cy="180" r="44" fill="#f2e7cf"/>
  <circle cx="1306" cy="170" r="40" fill="#24406e" opacity="0.55"/>

  <!-- far skyline -->
  <g fill="#1b3152" opacity="0.65">
    <rect x="60" y="640" width="70" height="140"/>
    <rect x="160" y="600" width="54" height="180"/>
    <rect x="240" y="660" width="80" height="120"/>
    <rect x="980" y="620" width="64" height="160"/>
    <rect x="1180" y="650" width="90" height="130"/>
    <rect x="1400" y="610" width="70" height="170"/>
    <rect x="1500" y="670" width="60" height="110"/>
  </g>

  <!-- main skyline -->
  <g fill="#0a1424">
    <rect x="120" y="560" width="58" height="220"/>
    <rect x="200" y="610" width="46" height="170"/>
    <rect x="268" y="520" width="66" height="260"/>
    <rect x="352" y="580" width="50" height="200"/>
    <rect x="420" y="470" width="72" height="310"/>
    <rect x="510" y="600" width="48" height="180"/>
    <rect x="566" y="540" width="60" height="240"/>
    <!-- Burj Khalifa -->
    <polygon points="612,780 636,330 664,330 688,780"/>
    <polygon points="636,330 648,240 660,330"/>
    <rect x="646" y="150" width="6" height="100"/>
    <rect x="620" y="300" width="6" height="36"/>
    <rect x="658" y="300" width="6" height="36"/>
    <rect x="700" y="620" width="56" height="160"/>
    <rect x="770" y="560" width="70" height="220"/>
    <rect x="856" y="640" width="52" height="140"/>
    <rect x="924" y="500" width="66" height="280"/>
    <rect x="1006" y="580" width="50" height="200"/>
    <rect x="1072" y="630" width="84" height="150"/>
    <rect x="1172" y="540" width="58" height="240"/>
    <rect x="1248" y="600" width="72" height="180"/>
    <rect x="1338" y="660" width="56" height="120"/>
    <rect x="1412" y="580" width="68" height="200"/>
    <rect x="1498" y="650" width="54" height="130"/>
  </g>
  <!-- antennas -->
  <g stroke="#0a1424" stroke-width="4">
    <line x1="456" y1="470" x2="456" y2="420"/>
    <line x1="957" y1="500" x2="957" y2="448"/>
    <line x1="1201" y1="540" x2="1201" y2="492"/>
  </g>

  <!-- lit windows -->
  <g fill="#e8b06a" opacity="0.8">
    <rect x="134" y="580" width="5" height="5"/>
    <rect x="156" y="620" width="5" height="5"/>
    <rect x="138" y="680" width="5" height="5"/>
    <rect x="282" y="540" width="5" height="5"/>
    <rect x="306" y="590" width="5" height="5"/>
    <rect x="286" y="660" width="5" height="5"/>
    <rect x="436" y="500" width="5" height="5"/>
    <rect x="464" y="556" width="5" height="5"/>
    <rect x="440" y="640" width="5" height="5"/>
    <rect x="786" y="590" width="5" height="5"/>
    <rect x="812" y="650" width="5" height="5"/>
    <rect x="790" y="716" width="5" height="5"/>
    <rect x="940" y="530" width="5" height="5"/>
    <rect x="966" y="600" width="5" height="5"/>
    <rect x="944" y="680" width="5" height="5"/>
    <rect x="1188" y="570" width="5" height="5"/>
    <rect x="1212" y="640" width="5" height="5"/>
    <rect x="1266" y="630" width="5" height="5"/>
    <rect x="1430" y="610" width="5" height="5"/>
    <rect x="1456" y="680" width="5" height="5"/>
    <rect x="646" y="420" width="5" height="5"/>
    <rect x="648" y="520" width="5" height="5"/>
    <rect x="650" y="640" width="5" height="5"/>
  </g>

  <!-- horizon glow -->
  <rect y="774" width="1600" height="6" fill="#e8b06a" opacity="0.4"/>

  <!-- reflections -->
  <g fill="#e8b06a" opacity="0.22">
    <rect x="644" y="790" width="8" height="120"/>
    <rect x="452" y="790" width="6" height="90"/>
    <rect x="955" y="790" width="6" height="100"/>
    <rect x="1200" y="790" width="6" height="80"/>
    <rect x="1445" y="790" width="6" height="70"/>
    <rect x="292" y="790" width="6" height="84"/>
    <rect x="792" y="790" width="6" height="76"/>
  </g>
  <g fill="#cfdce7" opacity="0.12">
    <rect x="380" y="800" width="4" height="150"/>
    <rect x="1060" y="810" width="4" height="120"/>
    <rect x="1340" y="800" width="4" height="140"/>
    <rect x="180" y="810" width="4" height="110"/>
  </g>
</svg>
